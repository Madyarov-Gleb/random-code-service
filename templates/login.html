<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Авторизация для получения одноразового четырёхзначного кода">
    <title>Вход · Генератор кода</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  </head>
  <body>
    <main class="container" aria-labelledby="page-title">
      <h1 id="page-title">Генератор кода</h1>
      <p>Войдите, чтобы получить случайный четырёхзначный код.</p>
      <p class="credentials">Логин: {{ demo_username }} · Пароль: {{ demo_password }}</p>

      {% if error %}
        <p class="alert" role="alert">{{ error }}</p>
      {% endif %}

      <form method="post">
        <label for="username">Логин</label>
        <input
          id="username"
          name="username"
          type="text"
          autocomplete="username"
          required
          autofocus
        >

        <label for="password">Пароль</label>
        <input
          id="password"
          name="password"
          type="password"
          autocomplete="current-password"
          required
        >

        <button type="submit">Показать код</button>
      </form>

      <p class="note">После обновления страницы потребуется войти снова.</p>
    </main>
  </body>
</html>
